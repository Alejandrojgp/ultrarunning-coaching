<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Eastern States 100 · Justyna Wilson — Race Plan, Three Brand Treatments</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
</style>
</head>
<body>
<template id="__bundler_thumbnail" data-bg-color="#f0eee9">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="800" fill="#f0eee9"/>
    <rect x="360" y="270" width="140" height="260" fill="#e8e1d4" stroke="#1c1d22" stroke-width="4"/>
    <rect x="530" y="270" width="140" height="260" fill="#ffffff" stroke="#0e1116" stroke-width="4"/>
    <rect x="700" y="270" width="140" height="260" fill="#f7f1e8" stroke="#c1654a" stroke-width="4"/>
    <text x="600" y="610" text-anchor="middle" font-family="Georgia, serif" font-size="46" fill="#1c1d22">Compare · three treatments</text>
  </svg>
</template>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="palette-ui.jsx"></script>
<script type="text/babel" src="far-horizon-es100.jsx"></script>
<script type="text/babel" src="endurance-method-es100.jsx"></script>
<script type="text/babel" src="beyond-finish-lines-es100.jsx"></script>

<script type="text/babel" data-presets="react">
function App() {
  const { variant, setVariant } = usePalette();
  React.useEffect(() => { es100RestoreScroll(); }, []);
  const fhPal = FarHorizonES100Palettes[variant] || FarHorizonES100Palettes.A;
  const emPal = EnduranceMethodES100Palettes[variant] || EnduranceMethodES100Palettes.A;
  const bflPal = BeyondFinishLinesES100Palettes[variant] || BeyondFinishLinesES100Palettes.A;
  return (
    <React.Fragment>
    <PaletteSwitch variant={variant} setVariant={setVariant} options={['O','A','B']} anchor="top-right" />
    <DesignCanvas
      title="Eastern States 100 · Justyna Wilson — Race Plan, Three Brand Treatments"
      subtitle="One data-driven plan, three brand voices. Use the Palette switch (top-right) to flip all three between Original, Amplified, and Spectrum."
    >
      <DCSection
        id="raceplans"
        title="Race plan pages"
        subtitle="The 9-week, three-race build to a sub-24 at Eastern States — expressed through each brand."
      >
        <DCArtboard id="fh-plan" label="01 · Far Horizon — Premium field dossier" width={1400} height={10580}>
          <div data-screen-label="01 Far Horizon ES100 Race Plan">
            <FarHorizonES100 pal={fhPal} />
          </div>
        </DCArtboard>

        <DCArtboard id="em-plan" label="02 · Endurance Method — Platform dashboard" width={1400} height={4580}>
          <div data-screen-label="02 Endurance Method ES100 Race Plan">
            <EnduranceMethodES100 pal={emPal} />
          </div>
        </DCArtboard>

        <DCArtboard id="bfl-plan" label="03 · Beyond Finish Lines — Letter to the athlete" width={1400} height={8900}>
          <div data-screen-label="03 Beyond Finish Lines ES100 Race Plan">
            <BeyondFinishLinesES100 pal={bflPal} />
          </div>
        </DCArtboard>
      </DCSection>

      <DCPostIt top={40} left={40} width={288} rotate={-1.5}>
        <strong>Same plan, three voices.</strong> The data headline — the entire gap to Kaylee is descents + rolling,
        not climbing — runs through all three. Far Horizon reads as a confidential dossier; Endurance Method as the
        engine-driven dashboard; Beyond Finish Lines as a personal letter to Justyna.
      </DCPostIt>
    </DesignCanvas>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<!-- Vercel Web Analytics -->
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };

<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
